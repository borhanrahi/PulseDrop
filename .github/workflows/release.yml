name: Release Multi-Platform Builds

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          else
            VER="0.1.${{ github.run_number }}"
            TAG="v${VER}"
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "Building Release Version: ${VER} (${TAG})"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: PulseDrop ${{ steps.get_version.outputs.tag_name }}
          body: |
            ## ⚡ PulseDrop ${{ steps.get_version.outputs.tag_name }} Multi-Platform Release

            Zero-cloud, high-speed local file sharing & clipboard synchronization across Windows, macOS, Linux, Android, and iOS.

            ### 📦 Available Downloads
            | Platform | File Type | Description |
            |---|---|---|
            | **Windows** | `.exe` (NSIS) / `.msi` (WiX) | Windows 10/11 64-bit installer |
            | **macOS** | `.dmg` | macOS Universal (Apple Silicon M1-M4 & Intel 64-bit) |
            | **Linux** | `.AppImage` / `.deb` | Linux portable AppImage & Debian package |
            | **Android** | `.apk` | Sideloadable Android APK for phones & tablets |
            | **iOS (iPhone/iPad)** | `.ipa` | Sideloadable iOS package (AltStore, SideStore, Sideloadly, TrollStore) |

            ---
            *Built automatically by GitHub Actions on commit `${{ github.sha }}`.*
          draft: false
          prerelease: false

  build-desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'macos-latest'
            target: 'universal-apple-darwin'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Bump Version to ${{ needs.create-release.outputs.version }}
        run: node ./scripts/bump-version.cjs ${{ needs.create-release.outputs.version }}

      - name: Build Desktop Binaries
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.create-release.outputs.tag_name }}
          releaseName: 'PulseDrop ${{ needs.create-release.outputs.tag_name }}'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          # Accept all SDK licenses automatically
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # Detect or install NDK
          NDK_PATH=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          fi
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "Using Android NDK: $NDK_PATH"

      - name: Install frontend dependencies
        run: npm ci

      - name: Bump Version to ${{ needs.create-release.outputs.version }}
        run: node ./scripts/bump-version.cjs ${{ needs.create-release.outputs.version }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Build frontend
        run: npm run build

      - name: Generate Production Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore src-tauri/gen/android/app/pulsedrop.jks \
            -alias pulsedrop \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pulsedrop123 \
            -keypass pulsedrop123 \
            -dname "CN=PulseDrop, OU=PulseDrop Release, O=PulseDrop Open Source, L=San Francisco, ST=California, C=US"

      - name: Build Android APK
        run: |
          npx tauri android build --apk
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          PULSEDROP_KEY_PASSWORD: pulsedrop123
          PULSEDROP_KEY_ALIAS: pulsedrop

      - name: Prepare and Sign APK for Release
        run: |
          mkdir -p release-apk
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS"

          find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | while read -r apk; do
            echo "Processing APK: $apk"
            fname=$(basename "$apk")
            out_apk="release-apk/PulseDrop-${{ needs.create-release.outputs.tag_name }}-${fname}"

            # 4-byte align the APK
            if [ -f "$BUILD_TOOLS/zipalign" ]; then
              $BUILD_TOOLS/zipalign -p -f 4 "$apk" "$out_apk" || cp "$apk" "$out_apk"
            else
              cp "$apk" "$out_apk"
            fi

            # Sign with V1, V2, and V3 signatures using production release keystore
            if [ -f "$BUILD_TOOLS/apksigner" ]; then
              $BUILD_TOOLS/apksigner sign \
                --ks src-tauri/gen/android/app/pulsedrop.jks \
                --ks-key-alias pulsedrop \
                --ks-pass pass:pulsedrop123 \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                "$out_apk" || true

              $BUILD_TOOLS/apksigner verify --verbose "$out_apk" || true
            fi
          done
          ls -la release-apk/

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: release-apk/*.apk

  build-ios:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install frontend dependencies
        run: npm ci

      - name: Bump Version to ${{ needs.create-release.outputs.version }}
        run: node ./scripts/bump-version.cjs ${{ needs.create-release.outputs.version }}

      - name: Build frontend
        run: npm run build

      - name: Initialize iOS Project & Configure Permissions
        run: |
          npx tauri ios init --ci || true
          find src-tauri/gen/apple -name "Info.plist" | while read -r plist; do
            echo "Configuring permissions for $plist"
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'PulseDrop needs access to the camera to scan QR codes for quick pairing with nearby devices.'" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'PulseDrop needs access to the camera to scan QR codes for quick pairing with nearby devices.'" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'PulseDrop uses the local network to discover and exchange files with nearby devices.'" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription 'PulseDrop uses the local network to discover and exchange files with nearby devices.'" "$plist" 2>/dev/null || true
          done

      - name: Build iOS Application
        run: |
          npx tauri ios build --no-sign --target aarch64

      - name: Package Unsigned IPA
        run: |
          mkdir -p release-ios
          FOUND_IPA=$(find src-tauri/gen/apple -name "*.ipa" -type f | head -n 1)
          if [ -n "$FOUND_IPA" ]; then
            echo "Found IPA generated by Tauri: $FOUND_IPA"
            cp "$FOUND_IPA" "release-ios/PulseDrop-${{ needs.create-release.outputs.tag_name }}-ios.ipa"
          else
            echo "Searching for .app bundle..."
            APP_BUNDLE=$(find src-tauri/gen/apple -name "*.app" -type d | head -n 1)
            if [ -n "$APP_BUNDLE" ]; then
              echo "Packaging .app bundle: $APP_BUNDLE"
              mkdir -p release-ios/Payload
              cp -r "$APP_BUNDLE" release-ios/Payload/
              cd release-ios
              zip -r "PulseDrop-${{ needs.create-release.outputs.tag_name }}-ios.ipa" Payload
              cd ..
            else
              echo "Searching for .xcarchive..."
              ARCHIVE=$(find src-tauri/gen/apple -name "*.xcarchive" -type d | head -n 1)
              if [ -n "$ARCHIVE" ]; then
                mkdir -p release-ios/Payload
                cp -r "$ARCHIVE/Products/Applications/"*.app release-ios/Payload/
                cd release-ios
                zip -r "PulseDrop-${{ needs.create-release.outputs.tag_name }}-ios.ipa" Payload
                cd ..
              fi
            fi
          fi
          ls -lh release-ios/

      - name: Upload iOS IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: release-ios/*.ipa
