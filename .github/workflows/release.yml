name: Release Multi-Platform Builds

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          else
            VER="0.1.${{ github.run_number }}"
            TAG="v${VER}"
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "Building Release Version: ${VER} (${TAG})"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: PulseDrop ${{ steps.get_version.outputs.tag_name }}
          body: |
            ## ⚡ PulseDrop ${{ steps.get_version.outputs.tag_name }} Multi-Platform Release

            Zero-cloud, high-speed local file sharing & clipboard synchronization across Windows, macOS, Linux, and Android.

            ### 📦 Available Downloads
            | Platform | File Type | Description |
            |---|---|---|
            | **Windows** | `.exe` (NSIS) / `.msi` (WiX) | Windows 10/11 64-bit installer |
            | **macOS** | `.dmg` | macOS Universal (Apple Silicon M1-M4 & Intel 64-bit) |
            | **Linux** | `.AppImage` / `.deb` | Linux portable AppImage & Debian package |
            | **Android** | `.apk` | Sideloadable Android APK for phones & tablets |

            ---
            *Built automatically by GitHub Actions on commit `${{ github.sha }}`.*
          draft: false
          prerelease: false

  build-desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'macos-latest'
            target: 'universal-apple-darwin'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Bump Version to ${{ needs.create-release.outputs.version }}
        run: node ./scripts/bump-version.cjs ${{ needs.create-release.outputs.version }}

      - name: Build Desktop Binaries
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.create-release.outputs.tag_name }}
          releaseName: 'PulseDrop ${{ needs.create-release.outputs.tag_name }}'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      - name: Bump Version to ${{ needs.create-release.outputs.version }}
        run: node ./scripts/bump-version.cjs ${{ needs.create-release.outputs.version }}

      - name: Build frontend
        run: npm run build

      - name: Build Android APK
        run: |
          npx tauri android build --apk
        env:
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | while read -r apk; do
            fname=$(basename "$apk")
            cp "$apk" "release-apk/PulseDrop-${{ needs.create-release.outputs.tag_name }}-${fname}"
          done

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: release-apk/*.apk
